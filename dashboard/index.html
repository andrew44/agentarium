<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcfcfb; --panel:#ffffff; --ink:#16181d; --ink2:#4a505c; --muted:#7a808c;
  --line:#e6e7ea; --grid:#eceef1;
  --opex:#2d6cdf; --capex:#c4590a; --mixed:#8a5fc0; --unknown:#aab0ba;
  --focus:#2d6cdf; --save:#1a7f45; --save-bg:#e8f5ec;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1a19; --panel:#222221; --ink:#f1f1ee; --ink2:#b9bcc3; --muted:#8b909a;
    --line:#32332f; --grid:#2b2c29;
    --opex:#4f86e6; --capex:#cf7433; --mixed:#9672cc; --unknown:#6b717c; --focus:#7aa2f0;
    --save:#5cc98a; --save-bg:#1f2e24;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1a19; --panel:#222221; --ink:#f1f1ee; --ink2:#b9bcc3; --muted:#8b909a;
  --line:#32332f; --grid:#2b2c29;
  --opex:#4f86e6; --capex:#cf7433; --mixed:#9672cc; --unknown:#6b717c; --focus:#7aa2f0;
  --save:#5cc98a; --save-bg:#1f2e24;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:800}
.brand span{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:not([aria-pressed="true"]):hover{background:var(--grid)}

/* hero */
.hero{padding:8px 0 30px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.big{display:flex;flex-direction:column;gap:2px}
.big .n{font-size:clamp(56px,11vw,112px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.big .n small{font-size:.36em;letter-spacing:-.02em;font-weight:700;margin-left:2px}
.big .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.big .t i{width:10px;height:10px;border-radius:3px;display:inline-block}
.big .d{font-size:13px;color:var(--muted)}
.big.right{text-align:right;align-items:flex-end}
.big.right .t{flex-direction:row-reverse}
.splitbar{margin-top:22px;height:64px;display:flex;gap:2px;border-radius:14px;overflow:hidden}
.splitbar div{min-width:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;transition:flex-basis .5s cubic-bezier(.2,.7,.2,1);cursor:default;white-space:nowrap;overflow:hidden}
.splitbar div:first-child{border-radius:14px 0 0 14px}
.splitbar div:last-child{border-radius:0 14px 14px 0}
.hero-foot{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:13px;color:var(--ink2)}
.hero-foot span{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.kpi{background:var(--panel);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
a.kpi{color:inherit;text-decoration:none}
a.kpi:hover{background:var(--grid)}
.kpi.save .v{color:var(--save)}

/* what agentarium did */
.did-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:2px 0 14px}
.did-head .n{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--save);line-height:1}
.did-head .w{font-size:14px;color:var(--ink2)}
.compare{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:16px}
.compare .track{height:10px;border-radius:5px;background:var(--grid);overflow:hidden;display:flex}
.compare .track div{height:100%}
.compare .amt{text-align:right;color:var(--ink2);font-weight:600}
.act{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.act:first-of-type{border-top:0}
.act .ico{font-size:18px;line-height:1;text-align:center}
.act .txt{color:var(--ink2);min-width:0}
.act .txt a{color:var(--ink);font-weight:700;text-decoration:none;margin-right:6px}
.act .txt a:hover{text-decoration:underline}
.act .amt{text-align:right;font-weight:700;white-space:nowrap}
.act .amt small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.act .amt.save{color:var(--save)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;margin-bottom:22px}
.panel h2{font-size:16px;margin:0;letter-spacing:-.01em}
.panel .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.link{font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.link:hover{background:var(--grid)}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:22px}
.cols .panel{margin-bottom:22px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.axis text{fill:var(--muted);font-size:11px}
.gridline{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 11px;border-radius:9px;font-size:12px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .08s;z-index:5;min-width:140px}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;justify-content:space-between;gap:16px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}

/* project rows */
.prow{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;padding:7px 0}
.prow .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .bar{display:flex;height:14px;gap:2px;border-radius:5px;overflow:hidden;background:var(--grid)}
.prow .bar div{min-width:0}
.prow .v{font-size:12px;color:var(--muted);text-align:right;min-width:48px}

/* skills */
.skill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.skill:first-of-type{border-top:0}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-opex{color:var(--opex)}.c-capex{color:var(--capex)}.c-mixed{color:var(--mixed)}.c-unknown{color:var(--muted)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink2)}

/* empty */
.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--ink2)}
.empty h2{margin:0 0 6px;color:var(--ink)}
.empty code{background:var(--grid);padding:2px 6px;border-radius:5px;font-size:13px}
.hidden{display:none!important}
.foot{color:var(--muted);font-size:12px;margin-top:8px}

@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .big.right{text-align:left;align-items:flex-start}
  .big.right .t{flex-direction:row}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Agentarium</h1><span id="dbinfo"></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Measure" id="metricSeg">
        <button data-m="spend" aria-pressed="false">Spend</button>
        <button data-m="tokens" aria-pressed="false">Tokens</button>
        <button data-m="sessions" aria-pressed="false">Sessions</button>
        <button data-m="prompts" aria-pressed="false">Prompts</button>
      </div>
      <div class="seg" role="group" aria-label="Date range" id="rangeSeg">
        <button data-d="7" aria-pressed="false">7d</button>
        <button data-d="30" aria-pressed="true">30d</button>
        <button data-d="90" aria-pressed="false">90d</button>
        <button data-d="0" aria-pressed="false">All</button>
      </div>
    </div>
  </header>

  <div id="empty" class="empty hidden"></div>

  <main id="app" class="hidden">
    <section class="hero" aria-label="Opex and capex share">
      <div class="hero-top">
        <div class="big"><div class="n" id="opexPct"></div><div class="t"><i style="background:var(--opex)"></i>OPEX</div><div class="d">Running it: insights, logs, metrics, Grafana</div></div>
        <div class="big right"><div class="n" id="capexPct"></div><div class="t"><i style="background:var(--capex)"></i>CAPEX</div><div class="d">Building it: generating and changing code</div></div>
      </div>
      <div class="splitbar" id="splitbar" role="img" aria-label=""></div>
      <div class="hero-foot" id="herofoot"></div>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="panel" id="did" aria-labelledby="didTitle">
      <div class="ph"><div><h2 id="didTitle">What agentarium did</h2><p class="sub" id="didSub"></p></div></div>
      <div id="didBody"></div>
    </section>

    <section class="panel">
      <div class="ph">
        <div><h2 id="trendTitle">Daily usage</h2><p class="sub" id="trendSub"></p></div>
        <button class="link" id="tableToggle" aria-pressed="false">View as table</button>
      </div>
      <div class="chart" id="trend"></div>
      <div class="scroll hidden" id="trendTable"></div>
    </section>

    <div class="cols">
      <section class="panel">
        <div class="ph"><div><h2>By project</h2><p class="sub">Share of each project's usage that was opex vs capex</p></div></div>
        <div id="projects"></div>
      </section>
      <section class="panel">
        <div class="ph"><div><h2>Skills used</h2><p class="sub">Sessions per skill, with the side it counts toward</p></div></div>
        <div id="skills"></div>
      </section>
    </div>

    <section class="panel">
      <div class="ph"><div><h2>Recent sessions</h2></div></div>
      <div class="scroll" id="recent"></div>
    </section>
    <p class="foot" id="foot"></p>
  </main>
</div>
<div class="tip" id="tip" role="presentation"></div>

<script>
const LABELS = ["opex","capex","mixed","unknown"];
const NAMES = {opex:"OPEX",capex:"CAPEX",mixed:"Mixed",unknown:"Unclassified"};
const state = {metric:null, days:30, table:false, data:null};
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colour = l => `var(--${l})`;
const METRIC_NAME = {spend:"spend", tokens:"tokens", sessions:"sessions", prompts:"prompts"};
const DOCS = "https://github.com/andrew44/agentarium/blob/main/docs/reference.md#";
const HELPERS = {
  "sommelier":["🍷","sommelier"], "cache-buster":["💥","cache-buster"], "diet":["🥗","diet"], "groundhog":["🦫","groundhog"],
  "blinkers":["🐴","blinkers"], "too-many-cooks":["🧑‍🍳","too-many-cooks"], "ballast":["⚓","ballast"], "budget":["💳","budget"],
  "premium":["🐙","copilot-premium-requests"], "haggle":["🤝","haggle"], "doggybag":["🥡","doggybag"], "kettle":["🫖","kettle"],
  "parrot":["🦜","parrot"], "colander":["🍝","colander"],
};

function fmt(n){
  if (n >= 1e9) return (n/1e9).toFixed(n>=1e10?0:1)+"B";
  if (n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1)+"M";
  if (n >= 1e3) return (n/1e3).toFixed(n>=1e4?0:1)+"k";
  return String(Math.round(n));
}
const pct = (a,b) => b ? a/b*100 : 0;
const rate = () => state.data?.money?.rate ?? 1;
const val = (o) => o ? (state.metric === "spend" ? (o.spend || 0) * rate() : o[state.metric]) : 0;
/** An amount already in the display currency. */
function money(v){
  const sym = state.data?.money?.symbol ?? "£", a = Math.abs(v);
  const str = a >= 1e6 ? (a/1e6).toFixed(1)+"M" : a >= 1e4 ? (a/1e3).toFixed(1)+"k"
    : a >= 100 ? Math.round(a).toLocaleString("en-GB") : a.toFixed(2);
  return (v < 0 ? "-" : "") + sym + str;
}
const usd = x => money((x || 0) * rate());
const fmtV = n => state.metric === "spend" ? money(n) : fmt(n);
const qty = n => state.metric === "spend" ? money(n) : `${fmt(n)} ${METRIC_NAME[state.metric]}`;
const times = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso.replace(/([+-]\d\d)(\d\d)$/,"$1:$2")); if (isNaN(t)) return iso.slice(0,10);
  const m = (Date.now()-t)/60000;
  if (m < 60) return Math.max(1,Math.round(m))+"m ago";
  if (m < 1440) return Math.round(m/60)+"h ago";
  return Math.round(m/1440)+"d ago";
}
function base(p){ return (p||"unknown").split(/[\\/]/).filter(Boolean).pop() || p; }

async function load(){
  try{
    const r = await fetch("/api/data?days="+state.days);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    state.data = d; render();
  }catch(e){
    showEmpty("Can't read the database", `<code>${esc(e.message)}</code>`);
  }
}
function showEmpty(title, body){
  $("#app").classList.add("hidden");
  const el = $("#empty"); el.classList.remove("hidden");
  el.innerHTML = `<h2>${title}</h2><p>${body}</p>`;
}

function render(){
  const d = state.data;
  $("#dbinfo").textContent = d.db_path || "";
  if (d.empty){
    const msg = d.reason === "no-database" || d.reason === "no-table"
      ? `No till database found at <code>${esc(d.db_path)}</code>. Install the agentarium plugin and use Claude Code or Copilot for a session, or point to another file with <code>--db</code>.`
      : `No sessions logged in this date range. Try a wider range, or run with <code>--demo</code> to preview.`;
    return showEmpty("Nothing to chart yet", msg);
  }
  if (!state.metric) setMetric(d.spend_usd > 0 ? "spend" : "tokens");
  $("#empty").classList.add("hidden"); $("#app").classList.remove("hidden");
  hero(d); kpis(d); did(d); trend(d); projects(d); skills(d); recent(d);
  $("#foot").textContent = `Percentages use ${METRIC_NAME[state.metric]}. Spend and savings are estimates at list prices, for token-billed sessions only: Copilot's premium requests are counted, never priced. Tokens are input plus output; cache reads are shown separately as the cache hit rate. Data refreshes when you change the range.`;
}

function hero(d){
  const tot = d.totals, sum = LABELS.reduce((s,l)=>s+val(tot[l]),0) || 1;
  const p = l => pct(val(tot[l]), sum);
  $("#opexPct").innerHTML = `${p("opex").toFixed(0)}<small>%</small>`;
  $("#capexPct").innerHTML = `${p("capex").toFixed(0)}<small>%</small>`;
  const bar = $("#splitbar");
  bar.innerHTML = LABELS.filter(l=>val(tot[l])>0).map(l=>{
    const x = p(l);
    return `<div style="flex:${x} 1 0;background:${colour(l)}" title="${NAMES[l]}: ${x.toFixed(1)}%">${x>=9?`${NAMES[l]} ${x.toFixed(0)}%`:""}</div>`;
  }).join("");
  bar.setAttribute("aria-label", LABELS.map(l=>`${NAMES[l]} ${p(l).toFixed(1)} percent`).join(", "));
  $("#herofoot").innerHTML = LABELS.map(l=>`<span><i class="dot" style="background:${colour(l)}"></i>${NAMES[l]} ${p(l).toFixed(1)}% · ${qty(val(tot[l]))}</span>`).join("");
}

function kpis(d){
  const all = LABELS.reduce((a,l)=>{for(const k in a)a[k]+=d.totals[l][k]||0;return a},
    {sessions:0,prompts:0,tokens:0,input:0,output:0,cache_read:0,cache_creation:0});
  const cacheDen = all.cache_read+all.cache_creation+all.input;
  const hit = cacheDen ? all.cache_read/cacheDen*100 : 0;
  const act = d.activity || {saved_usd:0, stepped_in:0}, spent = d.spend_usd || 0;
  const off = spent + act.saved_usd ? act.saved_usd/(spent + act.saved_usd)*100 : 0;
  const items = [
    ["Spend", usd(spent), spent ? `${fmt(all.sessions)} sessions · estimated at list prices` : "no token-billed sessions"],
    ["Saved by agentarium", usd(act.saved_usd), act.stepped_in ? `${off.toFixed(0)}% off the bill · stepped in ${times(act.stepped_in,"time","times")}` : "nothing to count yet", "save", "#did"],
    ["Tokens", fmt(all.tokens), `${fmt(all.input)} in · ${fmt(all.output)} out · ${fmt(all.prompts)} prompts`],
    ["Cache hit rate", hit.toFixed(0)+"%", `${fmt(all.cache_read)} tokens read from cache`],
  ];
  $("#kpis").innerHTML = items.map(([l,v,s,cls,href])=>{
    const tag = href ? "a" : "div";
    return `<${tag} class="kpi ${cls||""}"${href?` href="${href}"`:""}><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></${tag}>`;
  }).join("");
}

/* ---------- what agentarium did ---------- */
function sentence(h){
  const n = h.stopped + h.flagged, more = h.flagged ? `, and warned about ${fmt(h.flagged)} more` : "";
  switch (h.helper){
    case "sommelier": return (h.stopped ? `Routed ${times(h.stopped,"prompt","prompts")} to the model each one needed` +
        (h.saved_usd ? `, saving about ${usd(h.saved_usd)} net of hand-offs` : "") + "." +
        (h.extra_usd ? ` Sending hard prompts up to a stronger model cost ${usd(h.extra_usd)} more.` : "") : "") +
      (h.flagged ? ` Suggested a cheaper model ${times(h.flagged,"time","times")}.` : "");
    case "cache-buster": return (h.stopped ? `Held back ${times(h.stopped,"edit","edits")} that would have restarted the prompt cache mid-session${more}.`
      : `Warned before ${times(h.flagged,"edit","edits")} that would restart the prompt cache.`) +
      (h.at_stake_usd >= 0.005 ? ` About ${usd(h.at_stake_usd)} rode on the ones it only flagged.` : "");
    case "diet": return `Stopped ${times(h.stopped,"tool call","tool calls")} that would have flooded the context` +
      (h.tokens ? ` with about ${fmt(h.tokens)} tokens` : "") + `${more}.`;
    case "groundhog": return `Broke ${times(h.stopped,"loop","loops")}${more}.`;
    case "blinkers": return `Questioned ${times(h.stopped,"edit","edits")} the task didn't ask for${more}.`;
    case "too-many-cooks": return `Caught ${times(n,"subagent","subagents")} not worth sending` +
      (h.at_stake_usd >= 0.005 ? `, about ${usd(h.at_stake_usd)} of subagent cost between them` : "") + ".";
    case "ballast": return `Spotted ${times(n,"new task","new tasks")} started in a heavy conversation` +
      (h.tokens ? `, carrying ${fmt(h.tokens)} tokens of old context` : "") + ".";
    case "budget": return h.stopped ? `Paused ${times(h.stopped,"prompt","prompts")} at the budget limit${h.flagged ? ` and warned ${times(h.flagged,"time","times")} near it` : ""}.`
      : `Warned ${times(h.flagged,"time","times")} as a budget ran low.`;
    case "premium": return h.stopped ? `Paused ${times(h.stopped,"prompt","prompts")} once Copilot's premium requests ran out${more}.`
      : `Warned ${times(h.flagged,"time","times")} about Copilot's premium-request allowance.`;
    case "haggle": return `Quoted ${times(n,"task","tasks")} before they started` + (h.stopped ? `; ${fmt(h.stopped)} stopped at the agreed price` : "") + ".";
    case "doggybag": return `Packed ${times(h.stopped,"note","notes")} before the cache went cold` +
      (h.tokens ? `: carrying on from them skips up to ${fmt(h.tokens)} tokens of cache writes` : "") + ".";
    case "kettle": return `Said ${times(h.flagged,"time","times")} how long was left before the cache went cold` +
      (h.at_stake_usd >= 0.005 ? `, with about ${usd(h.at_stake_usd)} at risk in all` : "") + ".";
    case "colander": return `Strained ${times(h.stopped,"test, build or install output","test, build and install outputs")} before the model read them` +
      (h.tokens ? `, keeping about ${fmt(h.tokens)} tokens out of the context` : "") + ".";
    case "parrot": return `Spotted ${times(h.flagged,"instruction","instructions")} you kept repeating, and offered to write each one down.`;
    default: return `Stepped in ${times(n,"time","times")}.`;
  }
}
function figure(h){
  if (h.saved_usd >= 0.005) return `<div class="amt save">${usd(h.saved_usd)}<small>saved</small></div>`;
  if (h.tokens) return `<div class="amt">${fmt(h.tokens)}<small>tokens</small></div>`;
  if (h.at_stake_usd >= 0.005) return `<div class="amt">${usd(h.at_stake_usd)}<small>at stake</small></div>`;
  const n = h.stopped + h.flagged;
  return `<div class="amt">${fmt(n)}<small>${n === 1 ? "time" : "times"}</small></div>`;
}
function did(d){
  const act = d.activity || {saved_usd:0, stepped_in:0, helpers:[]}, spent = d.spend_usd || 0;
  const when = d.days ? `the last ${d.days} days` : "all time";
  if (!act.helpers.length){
    $("#didSub").textContent = `Nothing in ${when} yet.`;
    $("#didBody").innerHTML = `<p class="sub">sommelier and the guard-rails list what they did here as they work: prompts routed, floods and loops stopped, notes packed before the cache went cold.</p>`;
    return;
  }
  $("#didSub").textContent = `Each helper that stepped in, ${when}. Saved counts only spend a helper stopped and could price; the rest is what it caught and what was at stake.`;
  const without = spent + act.saved_usd, w = without ? spent/without*100 : 0;
  const head = `<div class="did-head"><span class="n">${usd(act.saved_usd)}</span><span class="w">saved, stepping in ${times(act.stepped_in,"time","times")}</span></div>` +
    (spent && act.saved_usd >= 0.005 ? `<div class="compare" role="img" aria-label="Spent ${usd(spent)}; about ${usd(without)} without agentarium">
      <span>Without it</span><div class="track"><div style="flex:1;background:var(--unknown)"></div></div><span class="amt">${usd(without)}</span>
      <span>Spent</span><div class="track"><div style="width:${w.toFixed(1)}%;background:var(--ink)"></div><div style="flex:1;background:var(--save);opacity:.35"></div></div><span class="amt">${usd(spent)}</span>
    </div>` : "");
  $("#didBody").innerHTML = head + `<div class="acts">` + act.helpers.map(h=>{
    const [ico, anchor] = HELPERS[h.helper] || ["•", h.helper];
    return `<div class="act"><span class="ico" aria-hidden="true">${ico}</span>
      <div class="txt"><a href="${DOCS}${anchor}" target="_blank" rel="noopener">${esc(h.helper)}</a>${esc(sentence(h))}</div>${figure(h)}</div>`;
  }).join("") + `</div>`;
}

/* ---------- trend: stacked daily columns ---------- */
function trend(d){
  $("#trendTitle").textContent = "Daily " + METRIC_NAME[state.metric];
  const days = d.daily;
  const labelsUsed = LABELS.filter(l=>days.some(x=>val(x[l])>0));
  $("#trendSub").textContent = `${days.length} days · hover a column for the split`;
  const box = $("#trend"), tbl = $("#trendTable");
  box.classList.toggle("hidden", state.table); tbl.classList.toggle("hidden", !state.table);
  $("#tableToggle").textContent = state.table ? "View as chart" : "View as table";
  $("#tableToggle").setAttribute("aria-pressed", state.table);
  if (state.table){
    tbl.innerHTML = `<table><thead><tr><th>Date</th>${labelsUsed.map(l=>`<th class="num">${NAMES[l]}</th>`).join("")}</tr></thead><tbody>${
      days.slice().reverse().map(x=>`<tr><td>${x.date}</td>${labelsUsed.map(l=>`<td class="num">${fmtV(val(x[l]))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    return;
  }
  const W = box.clientWidth || 800, H = 260, m = {t:10,r:8,b:26,l:state.metric === "spend" ? 52 : 40};
  const iw = W-m.l-m.r, ih = H-m.t-m.b;
  const totals = days.map(x=>labelsUsed.reduce((s,l)=>s+val(x[l]),0));
  const max = niceMax(Math.max(1,...totals));
  const step = iw/days.length, bw = Math.max(2, Math.min(28, step*0.68));
  const y = v => m.t + ih - v/max*ih;
  let g = "";
  for (let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    g += `<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${fmtV(v)}</text>`;
  }
  let bars = "", xl = "";
  const every = Math.ceil(days.length/8);
  days.forEach((x,i)=>{
    const cx = m.l + step*i + step/2; let acc = 0;
    const segs = labelsUsed.filter(l=>val(x[l])>0);
    segs.forEach((l,k)=>{
      const v = val(x[l]), y0 = y(acc), y1 = y(acc+v); acc += v;
      const h = Math.max(0,(y0-y1)-(k<segs.length-1?2:0));   // 2px surface gap between segments
      if (h<=0) return;
      const top = k===segs.length-1, r = top?Math.min(4,bw/2,h):0, X = cx-bw/2, Y = y0-h;
      bars += `<path fill="${colour(l)}" d="M${X},${y0} V${Y+r} ${r?`Q${X},${Y} ${X+r},${Y}`:`V${Y}`} H${X+bw-r} ${r?`Q${X+bw},${Y} ${X+bw},${Y+r}`:`H${X+bw}`} V${y0} Z"/>`;
    });
    if (i%every===0) xl += `<text x="${cx}" y="${H-6}" text-anchor="middle">${x.date.slice(5)}</text>`;
    bars += `<rect class="hit" data-i="${i}" x="${cx-step/2}" y="${m.t}" width="${step}" height="${ih}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked daily ${METRIC_NAME[state.metric]} split by opex and capex"><g class="axis">${g}${xl}</g>${bars}</svg><div class="hero-foot">${labelsUsed.map(l=>`<span><i class="dot" style="background:${colour(l)}"></i>${NAMES[l]}</span>`).join("")}</div>`;
  const tip = $("#tip");
  box.querySelectorAll(".hit").forEach(r=>{
    r.addEventListener("mousemove", e=>{
      const x = days[+r.dataset.i], tot = labelsUsed.reduce((s,l)=>s+val(x[l]),0);
      tip.innerHTML = `<b>${x.date}</b>` + labelsUsed.map(l=>`<div><span><i style="background:${colour(l)}"></i>${NAMES[l]}</span><span>${fmtV(val(x[l]))} (${pct(val(x[l]),tot).toFixed(0)}%)</span></div>`).join("") + `<div><span>Total</span><span>${fmtV(tot)}</span></div>`;
      const b = box.getBoundingClientRect(), tw = tip.offsetWidth;
      let left = e.clientX - b.left + 14; if (left+tw > b.width) left = e.clientX - b.left - tw - 14;
      tip.style.left = (b.left + window.scrollX + left) + "px"; tip.style.top = (b.top + window.scrollY + 8) + "px";
      tip.style.position = "absolute"; tip.style.opacity = 1;
    });
    r.addEventListener("mouseleave", ()=>{ tip.style.opacity = 0; });
  });
}
function niceMax(v){
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}

function projects(d){
  const rows = d.projects.map(p=>({name:base(p.cwd), full:p.cwd, by:p.by, tot:LABELS.reduce((s,l)=>s+val(p.by[l]),0)}))
    .filter(r=>r.tot>0).sort((a,b)=>b.tot-a.tot).slice(0,8);
  $("#projects").innerHTML = rows.length ? rows.map(r=>{
    const op = pct(val(r.by.opex), r.tot);
    return `<div class="prow" title="${esc(r.full)}"><div class="nm">${esc(r.name)}</div>
      <div class="bar" role="img" aria-label="${esc(r.name)}: ${LABELS.map(l=>NAMES[l]+" "+pct(val(r.by[l]),r.tot).toFixed(0)+"%").join(", ")}">${
        LABELS.filter(l=>val(r.by[l])>0).map(l=>`<div style="flex:${val(r.by[l])} 1 0;background:${colour(l)}"></div>`).join("")}</div>
      <div class="v">${op.toFixed(0)}% opex</div></div>`;
  }).join("") : `<p class="sub">No project data in this range.</p>`;
}

function skills(d){
  $("#skills").innerHTML = d.skills.length ? d.skills.map(s=>{
    const side = s.side || "unknown";
    return `<div class="skill"><span>${esc(s.name)}</span><span style="display:flex;gap:10px;align-items:center"><span class="chip c-${side}"><i></i>${NAMES[side]}</span><span style="color:var(--muted);min-width:20px;text-align:right">${s.sessions}</span></span></div>`;
  }).join("") : `<p class="sub">No skills recorded yet. They are logged when a session ends.</p>`;
}

function recent(d){
  $("#recent").innerHTML = `<table><thead><tr><th>Session</th><th>Project</th><th>Side</th><th class="num">Prompts</th><th class="num">Tokens</th><th class="num">Spend</th><th class="num">Updated</th></tr></thead><tbody>${
    d.recent.map(r=>`<tr><td class="mono">${esc((r.session_id||"").slice(0,12))}</td><td>${esc(base(r.cwd))}</td><td><span class="chip c-${r.label||"unknown"}"><i></i>${NAMES[r.label]||"Unclassified"}</span></td><td class="num">${r.prompts}</td><td class="num">${fmt(r.tokens)}</td><td class="num">${r.spend ? usd(r.spend) : "n/a"}</td><td class="num">${ago(r.updated_at)}</td></tr>`).join("")}</tbody></table>`;
}

function setMetric(m){
  state.metric = m;
  document.querySelectorAll("#metricSeg button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.m===m));
}
document.querySelectorAll("#metricSeg button").forEach(b=>b.addEventListener("click",()=>{
  setMetric(b.dataset.m);
  if (state.data) render();
}));
document.querySelectorAll("#rangeSeg button").forEach(b=>b.addEventListener("click",()=>{
  state.days = +b.dataset.d;
  document.querySelectorAll("#rangeSeg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  load();
}));
$("#tableToggle").addEventListener("click",()=>{ state.table = !state.table; if (state.data) trend(state.data); });
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if (state.data && !state.data.empty && !state.table) trend(state.data); },120); });
load();
</script>
</body>
</html>
