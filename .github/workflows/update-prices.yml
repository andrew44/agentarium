name: update model prices

# Refreshes data/model-prices.json from Claude's official pricing page
# (https://platform.claude.com/docs/en/about-claude/pricing) and commits it to main when prices
# change, with the patch version bumped so the release workflow publishes it.
on:
  schedule:
    - cron: "17 6 * * 1"  # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # all tags, to find the last release

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch latest prices
        run: node scripts/update_prices.ts

      - name: Run tests
        run: npm test

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/model-prices.json; then
            echo "No price changes."
            exit 0
          fi
          git diff --stat -- data/model-prices.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          eval "$(node .github/scripts/next_version.ts --base HEAD | grep '^version=')"
          node .github/scripts/next_version.ts --write "$version"
          git add data/model-prices.json .claude-plugin/plugin.json plugin.json
          git commit -m "Update Claude model prices (v$version)"
          git push
